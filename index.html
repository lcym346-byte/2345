<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e3a8a">
  <title>多店商品叫貨管理系統</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  
  <style>
    .lang-switcher {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .lang-switcher option { color: #111827; }
    .login-lang {
      position: absolute;
      top: 16px;
      right: 16px;
      background: white;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.modal-content {
  background: #fff; border-radius: 8px; padding: 24px;
  width: 90%; max-width: 380px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.modal-content h3 { margin: 0 0 8px; font-size: 18px; color: #111827; }
.form-row { margin-bottom: 12px; }
.form-row label { display:block; font-size:14px; margin-bottom:4px; color:#374151; }
.form-row input { width:100%; padding:8px 10px; border:1px solid #d1d5db; border-radius:6px; box-sizing:border-box; }
.btn-secondary {
  background:#f3f4f6; color:#374151;
  border:1px solid #d1d5db;
  padding:8px 16px; border-radius:6px; cursor:pointer;
}
.btn-secondary:hover { background:#e5e7eb; }
.msg-success { color:#059669; }
.msg-error { color:#dc2626; }
.login-extra { text-align:right; margin-top:10px; }
.login-extra a { color:#2563eb; font-size:13px; text-decoration:none; }
.login-extra a:hover { text-decoration:underline; }


  </style>
</head>
<body>

  <!-- 登入畫面 -->
  <div id="loginScreen" class="login-screen">
    <select id="loginLangSwitcher" class="lang-switcher login-lang"></select>
    <div class="login-box">
      <h1 data-i18n="login.title">多店商品叫貨管理系統</h1>
      <p class="subtitle" data-i18n="login.subtitle">請登入</p>
      <input type="email" id="loginEmail" data-i18n-placeholder="login.email_ph" placeholder="Email" autocomplete="username">
      <input type="password" id="loginPassword" data-i18n-placeholder="login.password_ph" placeholder="密碼" autocomplete="current-password">
      <button id="loginBtn" class="btn-primary" data-i18n="login.login_btn">登入</button>
      <p id="loginError" class="error-msg"></p>
      <div class="login-extra">
  <a href="#" id="forgotPwdLink" data-i18n="login.forgot">忘記密碼？</a>
</div>

    </div>
  </div>

  <!-- 主畫面（登入後顯示） -->
  <div id="mainScreen" class="main-screen" style="display:none;">
    <header class="top-bar">
      <div class="top-title" data-i18n="app.title_short">多店叫貨系統</div>
      <div class="top-user">
        <span id="userName"></span>
        <span id="userRole" class="role-badge"></span>
        <select id="langSwitcher" class="lang-switcher"></select>
        <button id="logoutBtn" class="btn-link" data-i18n="login.logout">登出</button>
      </div>
    </header>

    <main class="menu-grid">
      <a href="order.html" class="menu-card">
        <div class="menu-icon">📋</div>
        <div class="menu-label" data-i18n="menu.order">叫貨單</div>
      </a>
      <a href="products.html" class="menu-card" data-role="admin">
        <div class="menu-icon">📦</div>
        <div class="menu-label" data-i18n="menu.products">商品管理</div>
      </a>
      <a href="inventory.html" class="menu-card">
        <div class="menu-icon">📊</div>
        <div class="menu-label" data-i18n="menu.inventory">庫存管理</div>
      </a>
      <a href="stores.html" class="menu-card" data-role="admin">
        <div class="menu-icon">🏪</div>
        <div class="menu-label" data-i18n="menu.stores">分店管理</div>
      </a>
      <a href="suppliers.html" class="menu-card" data-role="admin">
        <div class="menu-icon">🚚</div>
        <div class="menu-label" data-i18n="menu.suppliers">供應商</div>
      </a>
      <a href="report.html" class="menu-card">
        <div class="menu-icon">📈</div>
        <div class="menu-label" data-i18n="menu.report">報表</div>
      </a>
      <a href="users.html" class="menu-card" data-role="admin">
        <div class="menu-icon">👥</div>
        <div class="menu-label" data-i18n="menu.users">使用者</div>
      </a>
      <a href="settings.html" class="menu-card" data-role="admin">
        <div class="menu-icon">⚙️</div>
        <div class="menu-label" data-i18n="menu.settings">系統設定</div>
      </a>
    </main>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } 
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } 
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { firebaseConfig } from "./js/core/firebase-config.js";
    import { initI18n, t, setLang, getLang, getSupportedLangs, LANG_NAMES, applyI18n } 
      from "./js/core/i18n.js";

    // 1. 先初始化多語系
    await initI18n();

    // 2. 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.firebaseAuth = auth;
    window.firebaseDB = db;

    // 3. 填充語言切換器
    const langOptions = getSupportedLangs().map(l => 
      `<option value="${l}" ${l === getLang() ? 'selected' : ''}>${LANG_NAMES[l]}</option>`
    ).join('');
    document.getElementById('loginLangSwitcher').innerHTML = langOptions;
    document.getElementById('langSwitcher').innerHTML = langOptions;
    
    document.getElementById('loginLangSwitcher').addEventListener('change', async (e) => {
      await setLang(e.target.value);
      document.getElementById('langSwitcher').value = e.target.value;
    });
    document.getElementById('langSwitcher').addEventListener('change', async (e) => {
      await setLang(e.target.value);
      document.getElementById('loginLangSwitcher').value = e.target.value;
      applyRolePermission(JSON.parse(sessionStorage.getItem('currentUser') || '{}').role);
    });

    // DOM
    const loginScreen = document.getElementById('loginScreen');
    const mainScreen = document.getElementById('mainScreen');
    const loginBtn = document.getElementById('loginBtn');
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    const userName = document.getElementById('userName');
    const userRole = document.getElementById('userRole');

    loginBtn.addEventListener('click', async () => {
      loginError.textContent = '';
      const email = loginEmail.value.trim();
      const password = loginPassword.value;
      if (!email || !password) {
        loginError.textContent = t('login.empty_input');
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.textContent = t('login.fail') + '：' + (err.code || err.message);
      }
    });

    loginPassword.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists()) {
          loginError.textContent = t('login.not_authorized');
          await signOut(auth);
          return;
        }
        const data = userDoc.data();
        if (data.active === false) {
          loginError.textContent = t('login.account_disabled');
          await signOut(auth);
          return;
        }

        userName.textContent = data.displayName || user.email;
        userRole.textContent = t('role.' + data.role) || data.role;
        userRole.dataset.role = data.role;
        applyRolePermission(data.role);

        sessionStorage.setItem('currentUser', JSON.stringify({
          uid: user.uid,
          email: user.email,
          displayName: data.displayName,
          role: data.role,
          storeId: data.storeId
        }));

        loginScreen.style.display = 'none';
        mainScreen.style.display = 'block';
      } else {
        sessionStorage.removeItem('currentUser');
        mainScreen.style.display = 'none';
        loginScreen.style.display = 'flex';
        loginEmail.value = '';
        loginPassword.value = '';
      }
    });

    function applyRolePermission(role) {
      document.querySelectorAll('[data-role="admin"]').forEach(el => {
        el.style.display = (role === 'admin') ? '' : 'none';
      });
    }
    // ---------- 忘記密碼 ----------
const forgotLink   = document.getElementById('forgotPwdLink');
const forgotModal  = document.getElementById('forgotModal');
const forgotEmail  = document.getElementById('forgotEmail');
const forgotMsg    = document.getElementById('forgotMsg');
const forgotCancel = document.getElementById('forgotCancel');
const forgotSubmit = document.getElementById('forgotSubmit');

forgotLink.addEventListener('click', (e) => {
  e.preventDefault();
  // 預填登入頁已輸入的 email
  const emailInput = document.getElementById('loginEmail');
  forgotEmail.value = emailInput ? emailInput.value.trim() : '';
  forgotMsg.textContent = '';
  forgotMsg.className = '';
  forgotModal.style.display = 'flex';
});

forgotCancel.addEventListener('click', () => {
  forgotModal.style.display = 'none';
});

// 點 modal 背景關閉
forgotModal.addEventListener('click', (e) => {
  if (e.target === forgotModal) forgotModal.style.display = 'none';
});

forgotSubmit.addEventListener('click', async () => {
  const email = forgotEmail.value.trim();
  if (!email) {
    forgotMsg.textContent = '請輸入 Email';
    forgotMsg.className = 'msg-error';
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    forgotMsg.textContent = 'Email 格式錯誤';
    forgotMsg.className = 'msg-error';
    return;
  }

  forgotSubmit.disabled = true;
  forgotMsg.textContent = '寄送中…';
  forgotMsg.className = '';

  try {
    const auth = getAuth();
    await sendPasswordResetEmail(auth, email);
    forgotMsg.textContent = '✅ 重設信已寄出，請至信箱（含垃圾信匣）查收';
    forgotMsg.className = 'msg-success';
    setTimeout(() => {
      forgotModal.style.display = 'none';
      forgotSubmit.disabled = false;
    }, 3000);
  } catch (err) {
    forgotSubmit.disabled = false;
    let msg = '寄送失敗';
    if (err.code === 'auth/user-not-found') msg = '查無此 Email 帳號';
    else if (err.code === 'auth/invalid-email') msg = 'Email 格式錯誤';
    else if (err.code === 'auth/too-many-requests') msg = '請求過多，請稍後再試';
    else msg = '寄送失敗：' + err.message;
    forgotMsg.textContent = msg;
    forgotMsg.className = 'msg-error';
  }
});

  </script>
<!-- 忘記密碼 Modal -->
<div id="forgotModal" class="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:9999;">
  <div class="modal-content" style="max-width:380px; background:#fff; border-radius:8px; padding:24px; width:90%; box-shadow:0 10px 30px rgba(0,0,0,0.2); margin:auto;">
    <h3 data-i18n="login.forgotTitle">重設密碼</h3>
    <p style="color:#6b7280; font-size:14px; margin:8px 0 16px;" data-i18n="login.forgotHint">
      請輸入您的 Email，系統將寄送重設密碼連結到您的信箱。
    </p>
    <div class="form-row">
      <label data-i18n="login.email">Email</label>
      <input type="email" id="forgotEmail" placeholder="your@email.com">
    </div>
    <div id="forgotMsg" style="margin:10px 0; font-size:14px;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
      <button class="btn-secondary" id="forgotCancel" data-i18n="common.cancel">取消</button>
      <button class="btn-primary" id="forgotSubmit" data-i18n="login.sendReset">寄送重設信</button>
    </div>
  </div>
</div>

</body>
</html>
